<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VarshaSync (RainShift) - Rain and Water Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef3f1; --card:#ffffff; --ink:#0f2a35; --muted:#4f6670; --line:#d3e0dc; --soft:#e6efec;
  --brand:#1f7a5a; --brand-ink:#ffffff; --rain:#2f8fc4; --dry:#c8892b; --crit:#c2362f; --warn:#b9770e; --ok:#1f7a5a;
  --crit-bg:#fbe9e7; --warn-bg:#fcf1de; --ok-bg:#e1f3ea; --focus:#0b63a8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08171d; --card:#0f2630; --ink:#e6f1ee; --muted:#9db6bd; --line:#21424d; --soft:#14323d;
    --brand:#3ec79a; --brand-ink:#04241a; --rain:#5bb8e8; --dry:#e4a948; --crit:#ff7b72; --warn:#f0b04a; --ok:#4fd3a3;
    --crit-bg:#3a1a1b; --warn-bg:#3a2c12; --ok-bg:#10342a; --focus:#7cc4f4;
  }
}
:root[data-theme="dark"]{
  --bg:#08171d; --card:#0f2630; --ink:#e6f1ee; --muted:#9db6bd; --line:#21424d; --soft:#14323d;
  --brand:#3ec79a; --brand-ink:#04241a; --rain:#5bb8e8; --dry:#e4a948; --crit:#ff7b72; --warn:#f0b04a; --ok:#4fd3a3;
  --crit-bg:#3a1a1b; --warn-bg:#3a2c12; --ok-bg:#10342a; --focus:#7cc4f4;
}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);scroll-behavior:smooth}
body{min-height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:'Figtree','Noto Sans Tamil','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
html[lang="ta"] body,html[lang="hi"] body{line-height:1.75}
h1,h2,h3,.display{font-family:'Bricolage Grotesque','Noto Sans Tamil','Noto Sans Devanagari',system-ui,sans-serif;letter-spacing:-.01em}
html[lang="ta"] h1,html[lang="ta"] h2,html[lang="ta"] h3,html[lang="hi"] h1,html[lang="hi"] h2,html[lang="hi"] h3{letter-spacing:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

/* Surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.soft{background:var(--soft);border-radius:14px}
.muted{color:var(--muted)}
.hint{background:var(--soft);border-left:4px solid var(--rain);border-radius:10px;padding:12px 14px}
.hint b{display:block;margin-bottom:2px}

/* Sticky header */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;padding-top:6px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.langgrp{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.langgrp button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;min-height:40px}
.langgrp button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.iconbtn{border:1px solid var(--line);background:var(--soft);border-radius:999px;width:44px;height:44px;display:grid;place-items:center}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-weight:600;min-height:44px;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.tab:hover{border-color:var(--brand)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Hero */
.hero{position:relative;overflow:hidden;color:#f2fbff;isolation:isolate;transition:background .6s}
.hero[data-level="crit"]{background:radial-gradient(900px 340px at 85% -10%,#7f1d1d55,transparent 60%),linear-gradient(160deg,#171a3d,#0b1226 70%)}
.hero[data-level="mod"]{background:radial-gradient(900px 340px at 85% -10%,#b4530955,transparent 60%),linear-gradient(160deg,#0c3a55,#0b2a3a 70%)}
.hero[data-level="safe"]{background:radial-gradient(900px 340px at 85% -10%,#16a34a44,transparent 60%),linear-gradient(160deg,#0b5a52,#0a3d44 70%)}
#wx{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.hero h1{font-weight:800;font-size:clamp(2.4rem,7vw,4.4rem);line-height:1.02}
.scbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px solid #ffffff40;background:#ffffff14;border-radius:14px;padding:12px 14px;min-height:64px;flex:1 1 180px;transition:transform .15s,background .2s,border-color .2s}
.scbtn:hover{background:#ffffff26;transform:translateY(-2px)}
.scbtn:active{transform:translateY(0)}
.scbtn[aria-pressed="true"]{background:#ffffff;color:#0f2a35;border-color:#fff}
.scbtn small{opacity:.82}
.statuscard{background:#ffffff12;border:1px solid #ffffff2e;border-radius:22px;padding:18px;backdrop-filter:blur(6px)}
.gauge-arc{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1),stroke .4s}
.herochip{background:#ffffff14;border:1px solid #ffffff26;border-radius:14px;padding:10px 14px}

/* Level badges */
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-weight:700;font-size:.85rem}
.b-crit{background:var(--crit-bg);color:var(--crit)}
.b-mod{background:var(--warn-bg);color:var(--warn)}
.b-safe{background:var(--ok-bg);color:var(--ok)}
.c-crit{color:var(--crit)} .c-mod{color:var(--warn)} .c-safe{color:var(--ok)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:10px 16px;font-weight:700;min-height:44px;transition:transform .12s,background .2s,border-color .2s}
.btn:hover{border-color:var(--brand)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-danger{background:var(--crit);color:#fff;border-color:var(--crit)}

/* Sliders */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:999px;background:linear-gradient(90deg,var(--rain),var(--brand));outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--card);border:4px solid var(--ink);box-shadow:0 2px 6px #0004;cursor:grab}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--card);border:4px solid var(--ink);cursor:grab}
.field{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:44px}
.field:focus{border-color:var(--brand)}
label.lbl{display:block;font-weight:700;margin-bottom:6px}
.val{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.25rem}

/* Ward tiles */
.ward{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border:2px solid var(--line);border-radius:16px;background:var(--card);transition:border-color .2s,transform .15s,box-shadow .2s;min-height:150px}
.ward:hover{transform:translateY(-3px);box-shadow:0 8px 22px #0002}
.ward[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 18%,transparent)}
.ward .score{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:2.4rem;line-height:1}
.meter{height:12px;border-radius:999px;background:var(--soft);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* Advisory banner */
.advisory{border-radius:16px;padding:16px 18px;border:2px solid}
.advisory.on{background:var(--crit-bg);border-color:var(--crit)}
.advisory.off{background:var(--ok-bg);border-color:var(--ok)}
.advisory.on .pulse{animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--crit) 55%,transparent)}100%{box-shadow:0 0 0 14px transparent}}

/* Checklist */
.phase{border:1.5px solid var(--line);border-radius:16px;background:var(--card);padding:16px;transition:opacity .3s,filter .3s}
.phase[data-locked="true"]{opacity:.55;filter:grayscale(.6)}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:12px;cursor:pointer;min-height:48px}
.task:hover{background:var(--soft)}
.task input{width:24px;height:24px;margin-top:2px;accent-color:var(--brand);flex:0 0 auto}
.task input:checked + span{text-decoration:line-through;color:var(--muted)}
.stagebtn{flex:1 1 150px;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px;text-align:left;min-height:64px;transition:border-color .2s,background .2s}
.stagebtn[aria-pressed="true"]{border-color:var(--ink);background:var(--soft)}

/* Tank */
.tankwater{transition:y .8s cubic-bezier(.2,.8,.2,1),height .8s cubic-bezier(.2,.8,.2,1)}
.drop{display:inline-block;width:18px;height:24px;margin:2px;transition:opacity .3s}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;min-height:44px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Ledger */
.tk{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);animation:slidein .35s ease-out}
@keyframes slidein{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.rank{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.15rem}
.tk[data-done="true"]{opacity:.62}
.qbar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--soft)}
.qbar>i{display:block;transition:flex-grow .5s}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:80;
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;max-width:min(92vw,460px);text-align:center;transition:opacity .25s,transform .25s;box-shadow:0 10px 30px #0006}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* Misc */
.gl{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card)}
.panel[hidden]{display:none}
.scroll-x{overflow-x:auto}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<!-- ============ Sticky top bar: brand, languages, theme, module tabs ============ -->
<div class="topbar">
  <div class="mx-auto max-w-6xl px-4">
    <div class="flex items-center justify-between gap-3">
      <div class="flex items-center gap-2 min-w-0">
        <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C16 3 6 14 6 20a10 10 0 0 0 20 0C26 14 16 3 16 3Z" fill="var(--rain)"/><path d="M11 21a5 5 0 0 0 5 5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
        <span class="display font-extrabold text-xl truncate">VarshaSync</span>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" class="btn btn-primary" id="locBtn" style="min-height:36px;padding:6px 14px;font-size:0.85rem">
          <span data-i18n="loc_btn">📍 Use My Location</span>
        </button>
        <div class="langgrp" role="group" aria-label="Language">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="ta" aria-pressed="false">தமிழ்</button>
          <button type="button" data-lang="hi" aria-pressed="false">हिन्दी</button>
        </div>
        <button type="button" class="iconbtn" id="themeBtn" aria-label="Switch light or dark" data-i18n-aria="theme_btn">
          <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
    <div class="tabs" role="tablist" aria-label="Modules" id="tabs">
      <button class="tab" role="tab" id="tab-flip" aria-controls="panel-flip" aria-selected="true" data-tab="flip" data-i18n="nav_flip"></button>
      <button class="tab" role="tab" id="tab-dirty" aria-controls="panel-dirty" aria-selected="false" data-tab="dirty" data-i18n="nav_dirty"></button>
      <button class="tab" role="tab" id="tab-guide" aria-controls="panel-guide" aria-selected="false" data-tab="guide" data-i18n="nav_guide"></button>
      <button class="tab" role="tab" id="tab-tank" aria-controls="panel-tank" aria-selected="false" data-tab="tank" data-i18n="nav_tank"></button>
      <button class="tab" role="tab" id="tab-report" aria-controls="panel-report" aria-selected="false" data-tab="report" data-i18n="nav_report"></button>
    </div>
  </div>
</div>

<div id="backendErr" hidden role="alert" style="background:var(--crit-bg);color:var(--crit);border-bottom:2px solid var(--crit);padding:14px 16px;font-weight:600;text-align:center" data-i18n="be_err"></div>

<!-- ============ Hero ============ -->
<header class="hero" id="hero" data-level="crit">
  <canvas id="wx" aria-hidden="true"></canvas>
  <div class="mx-auto max-w-6xl px-4 pt-10 pb-8">
    <div class="grid lg:grid-cols-5 gap-8 items-center">
      <div class="lg:col-span-3">
        <h1>VarshaSync</h1>
        <p class="display text-xl sm:text-2xl mt-3 font-semibold" data-i18n="app_tag"></p>
        <p class="mt-2 max-w-xl opacity-90" data-i18n="hero_kicker"></p>
        <p class="mt-7 mb-2 font-semibold" data-i18n="demo_try"></p>
        <div class="flex flex-wrap gap-3" id="scenarios">
          <button type="button" class="scbtn" data-sc="whiplash" aria-pressed="true"><b data-i18n="sc_whiplash"></b><small data-i18n="sc_whiplash_d"></small></button>
          <button type="button" class="scbtn" data-sc="base" aria-pressed="false"><b data-i18n="sc_base"></b><small data-i18n="sc_base_d"></small></button>
          <button type="button" class="scbtn" data-sc="gutter" aria-pressed="false"><b data-i18n="sc_gutter"></b><small data-i18n="sc_gutter_d"></small></button>
        </div>
      </div>
      <div class="lg:col-span-2">
        <div class="statuscard" aria-live="polite">
          <div class="font-semibold opacity-90" data-i18n="st_today"></div>
          <div class="flex justify-center mt-1">
            <svg viewBox="0 0 200 122" class="w-full" style="max-width:290px" role="img" aria-labelledby="gaugeTitle">
              <title id="gaugeTitle">Weather flip score</title>
              <path d="M10 100 A90 90 0 0 1 190 100" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="16" stroke-linecap="round"/>
              <path id="gaugeArc" class="gauge-arc" d="M10 100 A90 90 0 0 1 190 100" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-dasharray="282.74" stroke-dashoffset="282.74"/>
              <line x1="26.9" y1="67.5" x2="8.65" y2="59.3" stroke="rgba(255,255,255,.75)" stroke-width="2"/>
              <line x1="60" y1="30.7" x2="50" y2="13.4" stroke="rgba(255,255,255,.75)" stroke-width="2"/>
              <text id="gaugeNum" x="100" y="92" text-anchor="middle" fill="#fff" style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:44px">0</text>
              <text id="gaugeLbl" x="100" y="114" text-anchor="middle" fill="#fff" opacity=".85" style="font-size:11px"></text>
            </svg>
          </div>
          <div class="text-center">
            <div class="display text-2xl font-extrabold" id="lvlTitle"></div>
            <p class="mt-1 text-[0.98rem] opacity-95" id="lvlMsg"></p>
          </div>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mt-8">
      <div class="herochip"><div class="text-sm opacity-85" data-i18n="chip_rain"></div><div class="display text-2xl font-extrabold" id="chipRain"></div></div>
      <div class="herochip"><div class="text-sm opacity-85" data-i18n="chip_dry"></div><div class="display text-2xl font-extrabold" id="chipDry"></div></div>
      <div class="herochip"><div class="text-sm opacity-85" data-i18n="chip_wards"></div><div class="display text-2xl font-extrabold" id="chipWards"></div></div>
      <div class="herochip"><div class="text-sm opacity-85" data-i18n="chip_pending"></div><div class="display text-2xl font-extrabold" id="chipPending"></div></div>
    </div>
  </div>
</header>

<main class="mx-auto max-w-6xl px-4 py-8">

<!-- ================= Module 1: Sudden weather flip ================= -->
<section class="panel" id="panel-flip" role="tabpanel" aria-labelledby="tab-flip">
  <div class="mb-5">
    <h2 class="text-3xl font-extrabold" data-i18n="nav_flip"></h2>
    <p class="muted mt-1"><span data-i18n="sci_name"></span>: <span data-i18n="m1_sci_val"></span></p>
  </div>
  <div class="hint mb-6"><b data-i18n="simple_words"></b><span data-i18n="m1_simple"></span></div>

  <div class="grid lg:grid-cols-5 gap-6">
    <div class="card p-5 lg:col-span-3">
      <h3 class="text-xl font-bold mb-3" data-i18n="m1_chart"></h3>
      <div style="position:relative;height:310px"><canvas id="rainChart" role="img" aria-label="Rain and temperature chart"></canvas></div>
      <div class="flex flex-wrap gap-x-5 gap-y-2 mt-3 text-sm">
        <span class="inline-flex items-center gap-2"><i style="width:14px;height:14px;border-radius:4px;background:var(--dry);display:inline-block"></i><span data-i18n="key_dry"></span></span>
        <span class="inline-flex items-center gap-2"><i style="width:14px;height:14px;border-radius:4px;background:var(--crit);display:inline-block"></i><span data-i18n="key_storm"></span></span>
        <span class="inline-flex items-center gap-2"><i style="width:14px;height:14px;border-radius:4px;background:var(--rain);display:inline-block;opacity:.6"></i><span data-i18n="key_other"></span></span>
      </div>
    </div>

    <div class="lg:col-span-2 flex flex-col gap-6">
      <div class="card p-5">
        <div class="mb-5">
          <div class="flex justify-between items-baseline gap-3">
            <label class="lbl mb-0" for="inDry" data-i18n="m1_dry"></label>
            <span class="val" id="outDry"></span>
          </div>
          <input type="range" id="inDry" min="0" max="10" step="0.1" value="0.2" class="mt-3">
        </div>
        <div>
          <div class="flex justify-between items-baseline gap-3">
            <label class="lbl mb-0" for="inSurge" data-i18n="m1_surge"></label>
            <span class="val" id="outSurge"></span>
          </div>
          <input type="range" id="inSurge" min="0" max="150" step="0.5" value="94.5" class="mt-3">
        </div>
        <p class="muted text-sm mt-4" data-i18n="m1_slide_hint"></p>
      </div>

      <div class="card p-5">
        <div class="flex justify-between items-baseline gap-3">
          <h3 class="font-bold" data-i18n="m1_soak"></h3>
          <span class="val" id="soakPct"></span>
        </div>
        <div class="meter mt-2" style="height:18px"><i id="soakBar" style="background:var(--rain);width:0"></i></div>
        <div class="flex justify-between text-sm mt-1 muted"><span data-i18n="m1_soak_in"></span><span data-i18n="m1_runoff"></span></div>
        <p class="muted text-sm mt-2" data-i18n="m1_soak_note"></p>
      </div>
    </div>
  </div>

  <div class="grid md:grid-cols-2 gap-6 mt-6">
    <div class="card p-5">
      <h3 class="font-bold mb-2" data-i18n="m1_formula"></h3>
      <p data-i18n="m1_formula_txt"></p>
      <div class="soft p-3 mt-3 display font-bold text-lg" id="formulaLive"></div>
    </div>
    <div class="card p-5">
      <h3 class="font-bold mb-3" data-i18n="m1_bands"></h3>
      <div class="flex flex-col gap-2" id="bands">
        <div class="badge b-crit justify-between" data-band="crit"><span data-i18n="m1_band_c"></span><span data-i18n="m1_band_c_d"></span></div>

  p1d: ['Keep a torch, a charged phone or power bank, and basic medicines ready.', 'டார்ச் விளக்கு, சார்ஜ் செய்த போன் அல்லது பவர் பேங்க், அடிப்படை மருந்துகளைத் தயாராக வையுங்கள்.', 'टॉर्च, चार्ज किया फ़ोन या पावर बैंक और ज़रूरी दवाइयाँ तैयार रखें।'],
  p2a: ['Stay far from waterlogged electric poles and loose wires.', 'தண்ணீர் தேங்கிய மின்கம்பங்கள், தொங்கும் கம்பிகளிலிருந்து தூரமாக இருங்கள்.', 'पानी भरे बिजली के खंभों और ढीले तारों से दूर रहें।'],
  p2b: ['Let the first 15 minutes of roof rain run away. It washes off dust and bird droppings (“first flush”).', 'கூரையில் விழும் முதல் 15 நிமிட மழைநீரை வெளியே விட்டுவிடுங்கள்; அது தூசி, பறவைக் கழிவைக் கழுவும் (“முதல் கழுவல்”).', 'छत पर गिरने वाली पहली 15 मिनट की बारिश बहने दें। यह धूल और पक्षियों की बीट धो देती है (“फ़र्स्ट फ़्लश”)।'],
  p2c: ['If water is rising, move documents and valuables to high shelves.', 'நீர் உயர்ந்தால் ஆவணங்கள், விலைமதிப்புள்ள பொருட்களை உயரமான அலமாரியில் வையுங்கள்.', 'पानी बढ़े तो काग़ज़ात और क़ीमती सामान ऊँची अलमारी में रखें।'],
  p2d: ['Never walk or drive through flood water if you cannot see the road.', 'சாலை தெரியாத வெள்ள நீரில் நடக்கவோ வாகனம் ஓட்டவோ வேண்டாம்.', 'जिस बाढ़ के पानी में सड़क न दिखे, उसमें पैदल या गाड़ी से न जाएँ।'],
  p3a: ['Clean your water tank and disinfect it with chlorine (follow the label).', 'நீர்த்தொட்டியைச் சுத்தம் செய்து, குளோரின் கொண்டு கிருமிநீக்கம் செய்யுங்கள் (லேபிள் அறிவுரைப்படி).', 'पानी की टंकी साफ़ करें और क्लोरीन से कीटाणुरहित करें (लेबल के अनुसार)।'],
  p3b: ['Check well water. If it looks muddy or smells bad, do not drink it.', 'கிணற்று நீரைப் பாருங்கள். கலங்கலாகவோ துர்நாற்றமாகவோ இருந்தால் குடிக்க வேண்டாம்.', 'कुएँ का पानी देखें। गंदला या बदबूदार हो तो न पिएँ।'],
  p3c: ['Throw away food that touched flood water.', 'வெள்ள நீர் பட்ட உணவை வீசிவிடுங்கள்.', 'बाढ़ के पानी से छुआ खाना फेंक दें।'],
  p3d: ['Empty standing water around the home so mosquitoes cannot breed.', 'வீட்டைச் சுற்றித் தேங்கிய நீரை அகற்றுங்கள்; கொசு பெருகாது.', 'घर के आसपास जमा पानी हटाएँ ताकि मच्छर न पनपें।'],

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const LOCALE = { en: 'en-IN', ta: 'ta-IN', hi: 'hi-IN' };
let lang = 'en';

const li = () => LANGS.indexOf(lang);
const t = (k, vars) => {
  const e = T[k];
  let s = e ? (e[li()] || e[0]) : k;
  if (vars) for (const x in vars) s = s.split('{' + x + '}').join(vars[x]);
  return s;
};
const nf = (n, d = 0) => {
  try { return new Intl.NumberFormat(LOCALE[lang], { maximumFractionDigits: d, minimumFractionDigits: d }).format(n); }
  catch (e) { return Number(n).toFixed(d); }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage may be blocked */ } }
};
const wardName = w => w.name[lang] || w.name.en;

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(path + ' failed (' + res.status + ')');
  return res.json();
}
const showBackendError = on => { $('#backendErr').hidden = on === false; };

const state = {
  tab: 'flip', scenario: 'whiplash', input: { scenario: 'whiplash' },

  checks: {}
};

let reqId = 0;
async function refresh(fromSlider) {
  const my = ++reqId;
  try {
    const out = await api('/api/analyze', { input: state.input, tank: state.tank });
    if (my !== reqId) return;
    calc = out;
    showBackendError(false);
    renderAll(fromSlider);
  } catch (e) { showBackendError(true); }
}

   ===================================================================== */
let gaugeShown = 0, gaugeRaf = 0;
function animateGauge(to) {
  cancelAnimationFrame(gaugeRaf);
  const from = gaugeShown, t0 = performance.now(), dur = 900;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const step = now => {
    const k = reduce ? 1 : clamp((now - t0) / dur, 0, 1);
    const e = 1 - Math.pow(1 - k, 3);
    gaugeShown = from + (to - from) * e;
    $('#gaugeNum').textContent = nf(gaugeShown, 1);
    if (k < 1) gaugeRaf = requestAnimationFrame(step);
  };
  gaugeRaf = requestAnimationFrame(step);
}
function renderHero() {
  const m = metrics();
  const hero = $('#hero');
  hero.dataset.level = m.level;
  const arc = $('#gaugeArc');
  arc.style.strokeDashoffset = String(282.74 * (1 - clamp(m.W, 0, 60) / 60));
  arc.style.stroke = m.level === 'crit' ? '#ff8f86' : m.level === 'mod' ? '#ffcf6b' : '#7ef0be';
  animateGauge(m.W);
  $('#lvlTitle').textContent = t('lvl_' + m.level);
  $('#lvlMsg').textContent = t('msg_' + m.level);
  $('#chipRain').textContent = nf(m.surge, 1) + ' mm';
  $('#chipDry').textContent = nf(m.mean, 2) + ' mm';
  $('#chipWards').textContent = nf(advisoryWards().length) + ' / ' + nf(WARDS.wards.length);
  $('#chipPending').textContent = nf(calc.tickets.filter(x => x.status === 'pending').length);
  $$('#scenarios .scbtn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sc === state.scenario)));
  wx.rain = clamp(m.surge / 100, 0.05, 1);
}

let chart;
function chartColors(m) {
  const dry = cssv('--dry'), crit = cssv('--crit'), rain = cssv('--rain');

}
function initChart() {
  chart = new Chart($('#rainChart'), {
    data: {
      labels: [],
      datasets: [
        { type: 'bar', label: '', data: [], yAxisID: 'y', borderRadius: 4, order: 2 },

      ]
    },

      },

function updateChart() {
  if (!chart || !calc) return;
  const m = metrics();
  const muted = cssv('--muted'), line = cssv('--line'), dry = cssv('--dry');
  Chart.defaults.color = muted;
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  chart.data.labels = calc.series.map((_, i) => i + 1);
  const d0 = chart.data.datasets[0], d1 = chart.data.datasets[1];
  d0.label = t('ch_rain'); d0.data = calc.series.map(d => d.p); d0.backgroundColor = chartColors(m);
  d1.label = t('ch_temp'); d1.data = calc.series.map(d => d.t); d1.borderColor = dry; d1.backgroundColor = dry;
  chart.options.scales.x.title.text = t('ch_day');
  chart.options.scales.y.title.text = t('ch_rain');
  chart.options.scales.y1.title.text = t('ch_temp');
  chart.options.scales.y.grid.color = line;
  chart.options.scales.x.title.color = muted;

}
function renderFlip(fromSlider) {

  $('#soakBar').style.width = soak + '%';

    const on = b.dataset.band === m.level;
    b.style.outline = on ? '3px solid currentColor' : 'none';
    b.style.outlineOffset = '2px';

}

async function copyAlert() {
  const text = alertText();
  try {
    await navigator.clipboard.writeText(text);
    toast(t('copied'));
  } catch (e) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      toast(ok ? t('copied') : t('copy_fail'));
    } catch (e2) { toast(t('copy_fail')); }
  }
}

function ago(ts) {
  try {
    const rtf = new Intl.RelativeTimeFormat(LOCALE[lang], { numeric: 'auto' });
    const m = Math.round((ts - Date.now()) / 60000);
    if (Math.abs(m) < 60) return rtf.format(m, 'minute');
    const h = Math.round(m / 60);
    if (Math.abs(h) < 24) return rtf.format(h, 'hour');
    return rtf.format(Math.round(h / 24), 'day');
  } catch (e) { return ''; }
}

function renderLedger() {
  const pend = calc.tickets.filter(x => x.status === 'pending');
  const fixed = calc.tickets.filter(x => x.status === 'resolved');
  const scored = x => ({ tk: x, sev: x.sev, lvl: x.level });
  const pendSorted = pend.map(scored).sort((a, b) => b.sev - a.sev);
  const fixedSorted = fixed.map(scored).sort((a, b) => b.sev - a.sev);

  const counts = { crit: 0, high: 0, med: 0, low: 0 };
  pendSorted.forEach(x => counts[x.lvl]++);
  const lv = ['crit', 'high', 'med', 'low'];
  $('#qbar').innerHTML = pend.length
    ? lv.map(k => '<i style="flex-grow:' + counts[k] + ';background:' + SEV_STYLE[k].fg + '"></i>').join('')
    : '';

    '<span class="badge" style="background:' + SEV_STYLE[k].bg + ';color:' + SEV_STYLE[k].fg + '">' + esc(t('lv_' + k)) + ': ' + nf(counts[k]) + '</span>').join('');

  $$('#filters .chip').forEach(b => {
    const f = b.dataset.f;
    const n = f === 'all' ? calc.tickets.length : f === 'pending' ? pend.length : fixed.length;
    b.textContent = t(f === 'all' ? 'l_all' : f === 'pending' ? 'l_wait' : 'l_fixed') + ' ' + nf(n);

  let list = [];
  if (state.filter === 'all') list = pendSorted.concat(fixedSorted);
  else if (state.filter === 'pending') list = pendSorted;

  if (!list.length) { $('#ledger').innerHTML = '<div class="card p-6 text-center muted">' + esc(t('l_empty')) + '</div>'; return; }
  let rank = 0;
  $('#ledger').innerHTML = list.map(x => {
    const tk = x.tk, w = WARDS.wards.find(q => q.id === tk.ward), lvl = x.lvl, st = SEV_STYLE[lvl];

      '<div class="min-w-0">' +
        '<div class="flex flex-wrap items-center gap-2">' +
          '<b>' + esc(t('tp_' + tk.type)) + '</b>' +
          '<span class="badge" style="background:' + st.bg + ';color:' + st.fg + '">' + esc(t('lv_' + lvl)) + ' ' + nf(x.sev, 0) + '</span>' +
        '</div>' +
        '<div class="text-sm muted">' + esc(t('ward')) + ' ' + tk.ward + ' · ' + esc(wardName(w)) + ' · ' + nf(tk.people) + ' ' + esc(t('l_people')) + ' · ' + esc(ago(tk.ts)) + '</div>' +
        (tk.desc ? '<p class="mt-1">' + esc(tk.desc) + '</p>' : '') +
        '<div class="mt-3"><button type="button" class="btn ' + (done ? '' : 'btn-primary') + '" data-act="' + (done ? 'reopen' : 'resolve') + '" data-id="' + tk.id + '">' + esc(t(done ? 'btn_reopen' : 'btn_resolve')) + '</button></div>' +
      '</div></div>';

/* =====================================================================
   WEATHER CANVAS (Hero)
   ===================================================================== */
const wx = { drops: [], w: 0, h: 0, wind: 0, rain: 0.9, ctx: null };
function wxResize() {
  const c = $('#wx'); if (!c) return;
  const r = c.parentElement.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = Math.max(1, r.width * dpr); c.height = Math.max(1, r.height * dpr);
  wx.ctx = c.getContext('2d'); wx.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  wx.w = r.width; wx.h = r.height;
}
const newDrop = () => ({ x: Math.random() * (wx.w + 80) - 40, y: Math.random() * -wx.h, v: 6 + Math.random() * 9, l: 8 + Math.random() * 16 });
function wxFrame() {
  const ctx = wx.ctx; if (!ctx) return;
  ctx.clearRect(0, 0, wx.w, wx.h);
  const target = Math.round(10 + wx.rain * 170);
  while (wx.drops.length < target) wx.drops.push(newDrop());
  if (wx.drops.length > target) wx.drops.length = target;
  ctx.strokeStyle = 'rgba(190,230,255,.5)'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  ctx.beginPath();
  for (const d of wx.drops) {
    d.y += d.v * (0.6 + wx.rain); d.x += wx.wind * d.v * 0.15;
    if (d.y > wx.h + 20) { d.y = -20; d.x = Math.random() * (wx.w + 80) - 40; }
    ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + wx.wind * d.l * 0.15, d.y + d.l);
  }
  ctx.stroke();
}
function wxLoop() {
  if (!document.hidden) wxFrame();
  requestAnimationFrame(wxLoop);
}

/* =====================================================================
   LIVE RADAR MAP & GEOLOCATION
   ===================================================================== */
function drawRadar(lat, lon) {
  const canvas = $('#liveRadarCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  const cx = canvas.width / 2, cy = canvas.height / 2;
  ctx.strokeStyle = cssv('--line');
  ctx.lineWidth = 1.5;
  [40, 80, 110].forEach(r => {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 2 * Math.PI);
    ctx.stroke();
  });
  
  // User coordinate pin
  ctx.fillStyle = cssv('--crit');
  ctx.beginPath();
  ctx.arc(cx, cy, 7, 0, 2 * Math.PI);
  ctx.fill();
  ctx.fillStyle = cssv('--ink');
  ctx.font = '12px Figtree, sans-serif';
  ctx.fillText('You (' + lat.toFixed(2) + ', ' + lon.toFixed(2) + ')', cx + 12, cy + 4);
}

function handleLiveLocation() {
  if (!navigator.geolocation) {
    toast(t('loc_err'));
    return;
  }
  $('#locStatusBadge').textContent = t('loc_fetching');
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const { latitude, longitude } = pos.coords;
      $('#mapCoordsDisplay').textContent = `Lat: ${latitude.toFixed(3)}, Lon: ${longitude.toFixed(3)}`;
      try {
        const out = await api('/api/live', { lat: latitude, lon: longitude });
        calc = out;
        if (out.dynamic_wards && out.dynamic_wards.length > 0) {
          WARDS.wards = out.dynamic_wards;
          fillFormSelects();
        }
        showBackendError(false);
        renderAll(false);
        drawRadar(latitude, longitude);
        $('#locStatusBadge').textContent = 'Live Active';
        toast('Wards updated to your real surrounding towns!');
      } catch (e) {
        showBackendError(true);
      }
    },
    () => {
      toast(t('loc_err'));
      $('#locStatusBadge').textContent = 'Error';
    },
    { timeout: 10000 }
  );
}

function bind() {

  $$('.langgrp button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  $('#themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    store.set('varshasync.theme', next);
    setTimeout(() => renderAll(true), 30);
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTimeout(updateChart, 30));

  const tabs = $$('#tabs .tab');
  const showTab = (name, focus) => {
    state.tab = name;
    tabs.forEach(b => {
      const on = b.dataset.tab === name;
      b.setAttribute('aria-selected', String(on));
      b.tabIndex = on ? 0 : -1;
      if (on && focus) b.focus();
    });
    $$('.panel').forEach(p => { p.hidden = p.id !== 'panel-' + name; });
    if (name === 'flip') setTimeout(updateChart, 20);
    if (name === 'dirty') setTimeout(() => drawRadar(13.08, 80.27), 20);
  };
  tabs.forEach((b, i) => {
    b.addEventListener('click', () => showTab(b.dataset.tab));
    b.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') showTab(tabs[(i + 1) % tabs.length].dataset.tab, true);
      if (e.key === 'ArrowLeft') showTab(tabs[(i - 1 + tabs.length) % tabs.length].dataset.tab, true);
    });
  });
  showTab('flip');

  $$('#scenarios .scbtn').forEach(b => b.addEventListener('click', () => loadScenario(b.dataset.sc)));

  const onSlide = () => {
    state.input = { mean: parseFloat($('#inDry').value), surge: parseFloat($('#inSurge').value) };
    state.scenario = 'custom';
    refresh(true);
  };
  $('#inDry').addEventListener('input', onSlide);
  $('#inSurge').addEventListener('input', onSlide);

  $('#wardGrid').addEventListener('click', e => {
    const b = e.target.closest('[data-ward]'); if (!b) return;
    state.sel = +b.dataset.ward;
    $$('#wardGrid .ward').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    renderWardDetail();
  });
  $('#advisory').addEventListener('click', e => { if (e.target.closest('#copyAlert')) copyAlert(); });

  $('#stageBtns').addEventListener('click', e => {
    const b = e.target.closest('[data-stage]'); if (!b) return;
    state.stage = +b.dataset.stage; renderGuide();
  });
  $('#phases').addEventListener('change', e => {
    const c = e.target.closest('[data-task]'); if (!c) return;
    state.checks[c.dataset.task] = c.checked;
    store.set('varshasync.checks', JSON.stringify(state.checks));
    renderGuide();
  });
  $('#resetChecks').addEventListener('click', () => {
    state.checks = {}; store.set('varshasync.checks', '{}'); renderGuide();
  });

  const bindRange = (id, key) => $(id).addEventListener('input', e => { state.tank[key] = parseFloat(e.target.value); refresh(true); });
  bindRange('#tkRoof', 'roof'); bindRange('#tkRain', 'rain'); bindRange('#tkOcc', 'occ'); bindRange('#tkCap', 'cap');
  $('#roofTypes').addEventListener('click', e => {
    const b = e.target.closest('[data-rt]'); if (!b) return;
    state.tank.rt = b.dataset.rt; refresh(true);
  });
  $('#useStorm').addEventListener('click', () => {
    const s = Math.round(metrics().surge);
    state.tank.rain = clamp(s, 0, 300);
    $('#tkRain').value = state.tank.rain;
    refresh(true);
  });

  $('#fSubmit').addEventListener('click', async () => {
    const type = $('#fType').value, ward = +$('#fWard').value;
    const err = $('#fError');
    if (!type || !ward) { err.textContent = t('f_err'); return; }
    err.textContent = '';
    const people = clamp(parseInt($('#fPeople').value, 10) || 1, 1, 5000);
    try {
      const res = await api('/api/tickets', { type, ward, people, desc: $('#fDesc').value.trim() });
      $('#fDesc').value = '';
      state.filter = 'pending';
      await refresh(true);
      toast(t('toast_sent', { r: nf(res.rank), n: nf(res.pending) }));
    } catch (e) { showBackendError(true); }
  });
  $('#filters').addEventListener('click', e => {
    const b = e.target.closest('[data-f]'); if (!b) return;
    state.filter = b.dataset.f; renderLedger();
  });
  $('#ledger').addEventListener('click', async e => {
    const b = e.target.closest('[data-act]'); if (!b || !calc) return;
    const tk = calc.tickets.find(x => x.id === +b.dataset.id); if (!tk) return;
    const resolving = b.dataset.act === 'resolve';
    try {
      await api('/api/tickets/status', { id: tk.id, status: resolving ? 'resolved' : 'pending' });
      await refresh(true);
      const w = WARDS.wards.find(x => x.id === tk.ward);
      toast(t(resolving ? 'toast_done' : 'toast_reopen', { w: t('ward') + ' ' + w.id, s: nf(wardRisk(w).score, 1) }));
    } catch (err) { showBackendError(true); }
  });

  $('#glSearch').addEventListener('input', renderGlossary);

  window.addEventListener('resize', () => { wxResize(); });
  $('#hero').addEventListener('pointermove', e => {
    const r = $('#hero').getBoundingClientRect();
    wx.wind = ((e.clientX - r.left) / r.width - 0.5) * 8;
  });
}

async function boot() {

  try { state.checks = JSON.parse(store.get('varshasync.checks') || '{}') || {}; } catch (e) { state.checks = {}; }
  const savedLang = store.get('varshasync.lang');
  if (LANGS.includes(savedLang)) lang = savedLang;

  initChart();
  bind();
  wxResize();
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { wxFrame(); } else { wxLoop(); }

boot();
